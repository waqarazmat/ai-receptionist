# Railway build + deploy config, SHARED by both services built from `backend/`:
#   - the web service  (FastAPI/uvicorn)
#   - the worker service (arq) — set env RUN_WORKER=true on that service.
# Root Directory is set in the Railway dashboard (Settings → Source) to
# `backend`, so this file's location IS the effective build context.

[build]
builder = "NIXPACKS"

[deploy]
# NOTE: migrations are NOT run in a preDeployCommand anymore. Railway's one-shot
# pre-deploy container could not reach Postgres over the private network — it
# fell back to the public proxy and the SSL handshake got reset ("[Errno 104]
# Connection reset by peer"), aborting every deploy. Migrations now run inside
# railway-start.sh (the MAIN app container, which reaches Postgres reliably),
# for the web service only, with retries. See railway-start.sh.

# One start command for BOTH services — railway-start.sh branches on RUN_WORKER
# ($PORT is injected by Railway). This is the START (deploy) command, not a
# build step. Keep the worker service free of any dashboard Custom Build/Start
# Command so this drives it.
startCommand = "bash railway-start.sh"

# NO healthcheckPath: the arq worker serves no HTTP, so a /health check would
# hang its deploy forever in "Building". The web service starts serving only
# after the model loads anyway, so losing the health gate just means Railway
# routes a few seconds earlier on a cold deploy.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
