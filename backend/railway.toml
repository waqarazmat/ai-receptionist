# Railway build + deploy config for the FastAPI backend.
# Root Directory is set in the Railway dashboard (Settings → Source) to
# `backend`, so this file's location IS the effective build context.

[build]
builder = "NIXPACKS"

[deploy]
# Run migrations before every deploy. Railway executes preDeployCommand in
# a one-shot container that shares the same env + network as the service,
# so `alembic upgrade head` reaches the same Postgres. If it fails, the
# deploy aborts and the previous version keeps serving — no half-migrated
# state, no manual `railway ssh` after every schema change.
preDeployCommand = "alembic upgrade head"

# $PORT is injected by Railway per deploy — never hardcode.
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
# Startup takes ~30-60s on cold boot because sentence-transformers loads
# the all-MiniLM-L6-v2 model into memory. Give the healthcheck room.
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
