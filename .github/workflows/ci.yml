name: CI

# Fires on every push to any branch, and every pull request. Fast enough
# (~2-3 min total) that this is worth running on WIP branches too.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  # Cancel superseded runs on the same branch so a flurry of pushes doesn't
  # pile up in the queue. `head_ref` on PRs, `ref` on branch pushes.
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Frontend: TypeScript check → Vitest → production build ───────────
  # If the build fails, deploying the frontend would ship a broken app —
  # so we always run it, not just when tests pass.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Type errors are the most common source of "worked on my machine"
      # breakage. Runs before tests because failing types make the test
      # output far noisier than necessary.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npm run test:run

      # Production build catches issues Vitest can't — Vite plugin ordering,
      # Tailwind PurgeCSS misconfigurations, tree-shaking breakage, etc.
      - name: Production build
        run: npm run build

  # ─── Backend: pytest with real Postgres + Redis service containers ────
  # We spin up real services rather than mock them because most of the
  # existing tests already exercise integration (RLS, rate-limit key TTLs,
  # encryption round-trips). Adding mocks would obscure the very bugs
  # these tests exist to catch.
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # pgvector's official image is Postgres 16 + the vector extension
        # pre-installed. Matches what Railway serves (16.x with pgvector).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # These are throw-away CI values. Real prod secrets never leave
      # Railway. Nothing here is customer data.
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-jwt-secret-not-used-in-prod
      # A syntactically-valid Fernet key generated once for CI. Fernet
      # validates the key format at import time, so a random string won't
      # do — must be url-safe base64 encoded 32 bytes.
      MASTER_ENCRYPTION_KEY: 4kbAG84gRuUYMR9tUnR2xM1z_YGvGx0lXQO5NsKmZKI=
      BREVO_API_KEY: xkeysib-ci-placeholder
      OTP_FROM_EMAIL: ci@example.com
      SUPER_ADMIN_EMAIL: ci-admin@example.com
      APP_ENV: development

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # --break-system-packages matches how CLAUDE.md says local dev
        # installs (backend/CLAUDE.md). Also install pgvector's Python
        # client bindings — they're a transitive dep of requirements but
        # a fresh pip resolve occasionally misses them without an explicit
        # nudge in CI.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # pgvector extension is available in the image but must be enabled
      # explicitly on the test database before Alembic migrations run.
      - name: Enable pgvector extension
        env:
          PGPASSWORD: test
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql -h localhost -U test -d test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run migrations
        run: alembic upgrade head

      - name: Pytest
        # -q for terser output; --tb=short so a failing test doesn't dump
        # the whole traceback if it's obvious from the last few frames.
        run: pytest -q --tb=short
